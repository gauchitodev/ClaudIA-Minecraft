# Bloques que Claudia repone sola si desaparecen (por ejemplo, el botón de arranque de un mapa de aventura,
# que el mapa borra al apretarlo). Formato: "x y z bloque", con el bloque como en /setblock.
# Se revisa cada 15 segundos, así el mapa tiene tiempo de hacer lo suyo antes de que vuelva.
reponer: []
# Ejemplo:
# reponer:
#   - "-457 42 -195 minecraft:stone_button[face=wall,facing=south]"

# Lobby con selector de mundos (opcional: sin la sección "lobby" no se usa).
# Todos entran al lobby; cada placa de presión del lobby lleva al inicio de un mundo. /lobby vuelve.
# lobby:
#   carpeta: lobby              # se crea vacío la primera vez
#   spawn: "0.5 65 0.5 180"     # x y z yaw
# mundos:
#   tentrials:
#     nombre: Ten Trials
#     carpeta: ten-trials
#     spawn: "-458.5 41 -189.5 180"
#     dificultad: peaceful      # opcional: peaceful, easy, normal o hard, solo para este mapa
#     individual: true          # opcional: mapa de un jugador; sus bloques de comandos le caen a quien apretó el botón
# placas:                       # "x y z mundo", coordenadas de la placa en el lobby
#   - "-3 65 -6 tentrials"

# Skin de Claudia (cara de la foto de perfil + cuerpo de Bender), firmada con MineSkin. La genera skin/hacer-skin.py.
skin:
